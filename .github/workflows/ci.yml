name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:2.2
      - run: composer validate --no-check-publish
      - run: composer audit
        continue-on-error: true
      - run: docker compose config -q

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:2.2
      - run: composer config --global allow-plugins true && composer install --no-interaction --no-progress --no-scripts
      - run: composer check

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:2.2
      - run: composer config --global allow-plugins true && composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
